[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tap"
version = "0.1.0"
description = "View live Codex traffic captured by Surge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp==3.14.1",
    "brotli>=1.1",
    "backports-zstd>=1.0; python_version < '3.14'",
]

[project.scripts]
agent-tap = "agent_tap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_tap*"]

[tool.setuptools.package-data]
agent_tap = ["*.html", "*.json"]
"agent_tap.viewer_assets" = ["*.js", "*.css"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
